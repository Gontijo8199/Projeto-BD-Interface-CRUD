<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify CRUD Simplificado</title>
  <style>
    /* Estilos mínimos apenas para organizar as seções de forma responsiva */
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
      background-color: #f9f9f9;
      color: #333;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      box-sizing: border-box;
    }
    button {
      background-color: #1DB954;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #1ed760;
    }
    hr {
      border: 0;
      border-top: 1px solid #ccc;
      margin: 20px 0;
    }
    li {
      background: #fff;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .btn-acao {
      width: auto;
      padding: 5px 10px;
      margin-left: 5px;
      background-color: #333;
    }
  </style>
</head>
<body>

  <h1>Spotify CRUD - Painel</h1>
  <hr>

  <h2>[Caso de Uso: Ouvinte] Buscar Música</h2>
  <input type="text" id="buscaTitulo" placeholder="Digite o título exato...">
  <button onclick="buscarMusica()">Buscar</button>
  <button onclick="carregarMusicas()" style="background-color: #333;">Ver Todas</button>

  <hr>

  <h2>[Caso de Uso: Admin] Adicionar / Editar Música</h2>
  <input type="number" id="musicaId" placeholder="ID (Apenas para Editar)" readonly style="background-color: #eee;">
  <input type="text" id="musicaTitulo" placeholder="Título da Música">
  <input type="number" id="musicaDuracao" placeholder="Duração (segundos)">
  <button onclick="salvarMusica()">Salvar (Cadastrar ou Atualizar)</button>

  <hr>

  <h2>Catálogo de Músicas</h2>
  <ul id="listaMusicas" style="padding: 0; list-style: none;"></ul>

  <script>
    const API_URL = '/api/musicas';

    async function carregarMusicas() {
      const res = await fetch(API_URL);
      const musicas = await res.json();
      const lista = document.getElementById('listaMusicas');
      lista.innerHTML = '';
      
      musicas.forEach(m => {
        lista.innerHTML += `
          <li>
            <div><b>ID:</b> ${m.id} | <b>${m.titulo}</b> (${m.duracao}s)</div>
            <div style="margin-top: 5px;">
              <button class="btn-acao" onclick="preencherCampos(${m.id}, '${m.titulo}', ${m.duracao})">Editar</button>
              <button class="btn-acao" style="background-color: #e74c3c;" onclick="deletarMusica(${m.id})">Excluir</button>
            </div>
          </li>`;
      });
    }

    async function buscarMusica() {
      const titulo = document.getElementById('buscaTitulo').value;
      const res = await fetch(`${API_URL}/busca?titulo=${titulo}`);
      const musicas = await res.json();
      const lista = document.getElementById('listaMusicas');
      lista.innerHTML = '';
      
      if (musicas.length === 0) {
        lista.innerHTML = '<li>Nenhuma música encontrada.</li>';
        return;
      }
      
      musicas.forEach(m => {
        lista.innerHTML += `
          <li>
            <b>Encontrada no Índice:</b> ID: ${m.id} - ${m.titulo} (${m.duracao}s)
            <br>
            <button class="btn-acao" onclick="carregarMusicas()" style="margin-top:5px;">Voltar à Lista</button>
          </li>`;
      });
    }

    // CADASTRAR OU ATUALIZAR (CREATE / UPDATE)
    async function salvarMusica() {
      const id = document.getElementById('musicaId').value;
      const titulo = document.getElementById('musicaTitulo').value;
      const duracao = document.getElementById('musicaDuracao').value;

      if (!titulo || !duracao) {
        alert('Por favor, preencha o título e a duração!');
        return;
      }

      const dados = { titulo, duracao };

      if (id) {
        await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });
      } else {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });
      }

      limparCampos();
      carregarMusicas();
    }

    async function deletarMusica(id) {
      if (confirm('Tem certeza que deseja excluir?')) {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        carregarMusicas();
      }
    }

    function preencherCampos(id, titulo, duracao) {
      document.getElementById('musicaId').value = id;
      document.getElementById('musicaTitulo').value = titulo;
      document.getElementById('musicaDuracao').value = duracao;
      window.scrollTo(0, 0);
    }

    function limparCampos() {
      document.getElementById('musicaId').value = '';
      document.getElementById('musicaTitulo').value = '';
      document.getElementById('musicaDuracao').value = '';
    }

    carregarMusicas();
  </script>
</body>
</html>
